<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生3D作品展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 625px;
            max-height: 375px;
            width: auto;
            height: auto;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.3));
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
            margin-top: 15px;
        }

        .students-grid {
            padding: 50px 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .student-card {
            background: linear-gradient(135deg, #E3F2FD 0%, #ffffff 100%);
            border: 3px solid #BBDEFB;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .student-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 144, 226, 0.2), transparent);
            transition: left 0.5s;
        }

        .student-card:hover::before {
            left: 100%;
        }

        .student-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.4);
            border-color: #4A90E2;
        }

        .student-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
            overflow: hidden;
            position: relative;
        }

        .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .student-avatar .emoji-fallback {
            position: relative;
            z-index: 1;
        }

        .student-name {
            font-size: 22px;
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 10px;
        }

        .student-id {
            font-size: 13px;
            color: #64B5F6;
            margin-bottom: 15px;
        }

        .view-button {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .view-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
        }

        .footer {
            padding: 30px;
            background: linear-gradient(to bottom, #f0f8ff 0%, #E3F2FD 100%);
            text-align: center;
            color: #555;
            border-top: 3px dashed #BBDEFB;
        }

        .footer h3 {
            color: #1976D2;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .qr-info {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #BBDEFB;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.1);
        }

        .qr-info p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .qr-info code {
            background: #E3F2FD;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            color: #1976D2;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .logo {
                max-width: 450px;
                max-height: 250px;
            }

            .header p {
                font-size: 16px;
            }

            .students-grid {
                grid-template-columns: 1fr;
                padding: 30px 20px;
            }

            .student-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="MODELS/00.png" alt="Logo" class="logo">
            </div>
            <p>請選擇要觀看的學生作品（共24位學生）</p>
        </div>

        <div class="students-grid" id="studentsGrid">
            <!-- 學生卡片將由 JavaScript 動態生成 -->
        </div>

        <div class="footer">
            <h3>📱 QR Code 使用說明</h3>
            <div class="qr-info">
                <p><strong>如何為每位學生生成 QR Code：</strong></p>
                <p>使用網址：<code>index_simple.html?id=student編號</code></p>
                <p>例如：蕭方柔 <code>?id=student1</code> / 李玨潤 <code>?id=student22</code> / 孫以澄 <code>?id=student24</code></p>
                <p style="margin-top: 15px; color: #1976D2; font-weight: bold;">
                    💡 將完整網址轉換成 QR Code，掃描後即可直接觀看該學生作品！
                </p>
            </div>
        </div>
    </div>

    <script>
        // 學生資料 - 共24位（已修正所有名字）
        const studentsData = {
            'student1': { name: '蕭方柔', emoji: '🐵', avatar: 'MODELS/avatars/avatar-01.png', id: 'student1' },
            'student2': { name: '張品卉', emoji: '🎨', avatar: 'MODELS/avatars/avatar-02.png', id: 'student2' },
            'student3': { name: '馬維彤', emoji: '✨', avatar: 'MODELS/avatars/avatar-03.png', id: 'student3' },
            'student4': { name: '黃品瑄', emoji: '🌸', avatar: 'MODELS/avatars/avatar-04.png', id: 'student4' },
            'student5': { name: '楊壹壹', emoji: '🦋', avatar: 'MODELS/avatars/avatar-05.png', id: 'student5' },
            'student6': { name: '羅安', emoji: '💫', avatar: 'MODELS/avatars/avatar-06.png', id: 'student6' },
            'student7': { name: '劉彥秀', emoji: '🎭', avatar: 'MODELS/avatars/avatar-07.png', id: 'student7' },
            'student8': { name: '丁若羚', emoji: '🌺', avatar: 'MODELS/avatars/avatar-08.png', id: 'student8' },
            'student9': { name: '林映辰', emoji: '🌈', avatar: 'MODELS/avatars/avatar-09.png', id: 'student9' },
            'student10': { name: '王瑀彤', emoji: '🌻', avatar: 'MODELS/avatars/avatar-10.png', id: 'student10' },
            'student11': { name: '許安', emoji: '🎪', avatar: 'MODELS/avatars/avatar-11.png', id: 'student11' },
            'student12': { name: '許子芸', emoji: '🎯', avatar: 'MODELS/avatars/avatar-12.png', id: 'student12' },
            'student13': { name: '林品彤', emoji: '💐', avatar: 'MODELS/avatars/avatar-13.png', id: 'student13' },
            'student14': { name: '陳頣樂', emoji: '⭐', avatar: 'MODELS/avatars/avatar-14.png', id: 'student14' },
            'student15': { name: '吳姵諭', emoji: '🐍', avatar: 'MODELS/avatars/avatar-15.png', id: 'student15' },
            'student16': { name: '江明曦', emoji: '🎬', avatar: 'MODELS/avatars/avatar-16.png', id: 'student16' },
            'student17': { name: '林曉黎', emoji: '🎤', avatar: 'MODELS/avatars/avatar-17.png', id: 'student17' },
            'student18': { name: '簡妤庭', emoji: '🎧', avatar: 'MODELS/avatars/avatar-18.png', id: 'student18' },
            'student19': { name: '莊加安', emoji: '🎹', avatar: 'MODELS/avatars/avatar-19.png', id: 'student19' },
            'student20': { name: '蔡汶佑', emoji: '🎸', avatar: 'MODELS/avatars/avatar-20.png', id: 'student20' },
            'student21': { name: '邱子熙', emoji: '🎻', avatar: 'MODELS/avatars/avatar-21.png', id: 'student21' },
            'student22': { name: '李玨潤', emoji: '🦖', avatar: 'MODELS/avatars/avatar-22.png', id: 'student22' },
            'student23': { name: '林書歆', emoji: '🐑', avatar: 'MODELS/avatars/avatar-23.png', id: 'student23' },
            'student24': { name: '孫以澄', emoji: '🐮', avatar: 'MODELS/avatars/avatar-24.png', id: 'student24' }
        };

        function generateStudentCards() {
            const grid = document.getElementById('studentsGrid');
            
            Object.values(studentsData).forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.onclick = () => viewStudent(student.id);
                
                // 創建頭像HTML（支援圖片和emoji回退）
                const avatarHTML = `
                    <div class="student-avatar" id="avatar-${student.id}">
                        <img src="${student.avatar}" 
                             alt="${student.name}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                             onload="this.nextElementSibling.style.display='none';">
                        <span class="emoji-fallback" style="display:none;">${student.emoji}</span>
                    </div>
                `;
                
                card.innerHTML = `
                    ${avatarHTML}
                    <div class="student-name">${student.name}</div>
                    <div class="student-id">學生ID: ${student.id}</div>
                    <button class="view-button" onclick="viewStudent('${student.id}'); event.stopPropagation();">
                        觀看作品 →
                    </button>
                `;
                
                grid.appendChild(card);
            });
        }

        function viewStudent(studentId) {
            window.location.href = `index_simple.html?id=${studentId}`;
        }

        window.addEventListener('DOMContentLoaded', generateStudentCards);
    </script>
</body>
</html>
