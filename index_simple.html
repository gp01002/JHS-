<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生3D作品展示</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            max-width: 500px;
            max-height: 300px;
            width: auto;
            height: auto;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .student-name {
            font-size: 24px;
            font-weight: bold;
            opacity: 0.95;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .model-container {
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #E3F2FD 0%, #BBDEFB 100%);
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #4A90E2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #4A90E2;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .animation-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .animation-controls.visible {
            opacity: 1;
        }

        .control-btn {
            background: rgba(74, 144, 226, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .control-btn:disabled {
            background: rgba(150, 150, 150, 0.6);
            cursor: not-allowed;
        }

        .control-btn:not(:disabled):hover {
            background: rgba(53, 122, 189, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn.active {
            background: rgba(231, 76, 60, 0.9);
        }

        .speech-bubbles-container {
            padding: 40px 30px;
            background: linear-gradient(to bottom, #ffffff 0%, #f0f8ff 100%);
            position: relative;
            min-height: 200px;
        }

        .speech-bubble {
            position: relative;
            background: white;
            border-radius: 30px;
            padding: 25px 35px;
            margin: 25px 0;
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation-fill-mode: both;
            max-width: 85%;
            border: 3px solid #E3F2FD;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .speech-bubble.left {
            margin-left: 30px;
            margin-right: auto;
            background: linear-gradient(135deg, #E3F2FD 0%, #ffffff 100%);
            border-color: #4A90E2;
        }

        .speech-bubble.left::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 40%;
            width: 30px;
            height: 30px;
            background: inherit;
            border-radius: 50%;
            border: 3px solid #4A90E2;
            border-right: none;
            border-bottom: none;
        }

        .speech-bubble.left::after {
            content: '';
            position: absolute;
            left: -8px;
            top: 55%;
            width: 18px;
            height: 18px;
            background: inherit;
            border-radius: 50%;
            border: 3px solid #4A90E2;
            border-right: none;
            border-bottom: none;
        }

        .speech-bubble.right {
            margin-left: auto;
            margin-right: 30px;
            background: linear-gradient(135deg, #BBDEFB 0%, #E3F2FD 100%);
            border-color: #2196F3;
        }

        .speech-bubble.right::before {
            content: '';
            position: absolute;
            right: -15px;
            top: 40%;
            width: 30px;
            height: 30px;
            background: inherit;
            border-radius: 50%;
            border: 3px solid #2196F3;
            border-left: none;
            border-bottom: none;
        }

        .speech-bubble.right::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 55%;
            width: 18px;
            height: 18px;
            background: inherit;
            border-radius: 50%;
            border: 3px solid #2196F3;
            border-left: none;
            border-bottom: none;
        }

        .bubble-decoration {
            position: absolute;
            font-size: 32px;
            top: -20px;
            right: 25px;
            animation: float 2.5s ease-in-out infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            50% { 
                transform: translateY(-10px) rotate(5deg); 
            }
        }

        .speech-bubble:nth-child(1) { animation-delay: 0.2s; }
        .speech-bubble:nth-child(2) { animation-delay: 0.5s; }

        .controls {
            padding: 25px 30px;
            background: linear-gradient(to bottom, #f0f8ff 0%, #E3F2FD 100%);
            text-align: center;
            font-size: 14px;
            color: #555;
            border-top: 3px dashed #BBDEFB;
        }

        .controls p {
            margin: 8px 0;
        }

        @media (max-width: 600px) {
            .logo {
                max-width: 375px;
                max-height: 225px;
            }

            .student-name {
                font-size: 20px;
            }
            
            .model-container {
                height: 350px;
            }
            
            .speech-bubble {
                font-size: 16px;
                padding: 20px 25px;
                max-width: 90%;
                border-radius: 25px;
            }

            .control-btn {
                padding: 10px 16px;
                font-size: 12px;
            }

            .speech-bubbles-container {
                padding: 30px 15px;
            }

            .bubble-decoration {
                font-size: 26px;
                top: -18px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="MODELS/00.png" alt="Logo" class="logo" id="logoImage">
            </div>
            <div class="student-name" id="studentName">載入中...</div>
        </div>

        <div class="model-container" id="modelContainer">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在載入 3D 模型...</div>
                <div style="font-size: 14px; color: #888;">請稍候 (約 10-30 秒)</div>
            </div>
            
            <model-viewer
                id="modelViewer"
                alt="學生3D作品"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                exposure="1"
                camera-orbit="0deg 75deg 2.5m"
                style="width: 100%; height: 100%;">
            </model-viewer>

            <div class="animation-controls" id="animationControls">
                <button class="control-btn" id="playBtn" disabled>▶️ 播放</button>
                <button class="control-btn" id="pauseBtn" style="display: none;" disabled>⏸️ 暫停</button>
                <button class="control-btn" id="rotateBtn" disabled>🔄 旋轉</button>
            </div>
        </div>

        <div class="speech-bubbles-container" id="speechBubblesContainer">
            <div class="speech-bubble left">正在載入作品介紹...</div>
        </div>

        <div class="controls">
            <p>💡 使用滑鼠拖曳可以旋轉3D模型</p>
            <p>✨ 點擊播放按鈕可以觀看動畫效果</p>
        </div>
    </div>

                ]
            },
            'student19': {
                name: '莊加安',
                model: 'MODELS/19.glb',
                speeches: [

                    { text: '希望大家喜歡！', type: 'right', decoration: '🎹' }
                ]
            },
            'student20': {
                name: '羅安',
                model: 'MODELS/20.glb',
                speeches: [
                    { text: '嗨！我是羅安，這是我設計的作品', type: 'left' },
                    { text: '謝謝大家觀賞！', type: 'right', decoration: '🎸' }
                ]
            },
            'student21': {
                name: '邱子熙',
                model: 'MODELS/21.glb',
                speeches: [
                    { text: '我是邱子熙，這是我的創意作品', type: 'left' },
                    { text: '希望能帶給大家驚喜', type: 'right', decoration: '🎻' }
                ]
            }
        };

        let modelViewer = null;
        let isRotating = true;
        let modelLoaded = false;

        const loadingOverlay = document.getElementById('loadingOverlay');
        const animationControls = document.getElementById('animationControls');
        const speechBubblesContainer = document.getElementById('speechBubblesContainer');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const rotateBtn = document.getElementById('rotateBtn');

        function getStudentId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || urlParams.get('student') || 'student1';
        }

        function loadStudentWork() {
            const studentId = getStudentId();
            const studentData = studentsData[studentId];

            if (!studentData) {
                showError('找不到該學生的作品');
                return;
            }

            document.getElementById('studentName').textContent = studentData.name;
            displaySpeechBubbles(studentData.speeches);
            loadModel(studentData.model);
        }

        function displaySpeechBubbles(speeches) {
            speechBubblesContainer.innerHTML = '';
            
            speeches.forEach((speech, index) => {
                const bubble = document.createElement('div');
                bubble.className = `speech-bubble ${speech.type}`;
                bubble.style.animationDelay = `${index * 0.3}s`;
                
                if (speech.decoration && index === speeches.length - 1) {
                    const decoration = document.createElement('span');
                    decoration.className = 'bubble-decoration';
                    decoration.textContent = speech.decoration;
                    bubble.appendChild(decoration);
                }
                
                const textNode = document.createTextNode(speech.text);
                bubble.appendChild(textNode);
                
                speechBubblesContainer.appendChild(bubble);
            });
        }

        function loadModel(modelUrl) {
            modelViewer = document.getElementById('modelViewer');
            modelViewer.src = modelUrl;

            modelViewer.addEventListener('progress', (event) => {
                const progress = (event.detail.totalProgress * 100).toFixed(1);
                console.log('載入進度:', progress + '%');
            });

            modelViewer.addEventListener('load', () => {
                console.log('✅ 模型載入完成！');
                modelLoaded = true;
                
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    animationControls.classList.add('visible');
                }, 500);

                setTimeout(() => {
                    checkAndSetupAnimations();
                }, 800);
            });

            modelViewer.addEventListener('error', (event) => {
                console.error('❌ 模型載入失敗');
                showError('模型載入失敗，請檢查檔案是否存在');
            });

            setupControlButtons();
        }

        function checkAndSetupAnimations() {
            try {
                const animations = modelViewer.availableAnimations;
                console.log('可用動畫:', animations);

                if (animations && animations.length > 0) {
                    modelViewer.animationName = animations[0];
                    
                    playBtn.disabled = false;
                    pauseBtn.disabled = false;
                    rotateBtn.disabled = false;
                    
                    setTimeout(() => {
                        try {
                            modelViewer.play();
                            playBtn.style.display = 'none';
                            pauseBtn.style.display = 'block';
                            console.log('▶️ 自動開始播放動畫');
                        } catch (error) {
                            console.error('自動播放失敗:', error);
                        }
                    }, 500);
                } else {
                    rotateBtn.disabled = false;
                }
            } catch (error) {
                console.error('檢查動畫時出錯:', error);
            }
        }

        function setupControlButtons() {
            playBtn.onclick = () => {
                if (!modelLoaded) return;
                try {
                    modelViewer.play();
                    playBtn.style.display = 'none';
                    pauseBtn.style.display = 'block';
                } catch (error) {
                    console.error('播放失敗:', error);
                }
            };

            pauseBtn.onclick = () => {
                if (!modelLoaded) return;
                try {
                    modelViewer.pause();
                    pauseBtn.style.display = 'none';
                    playBtn.style.display = 'block';
                } catch (error) {
                    console.error('暫停失敗:', error);
                }
            };

            rotateBtn.onclick = () => {
                if (!modelLoaded) return;
                try {
                    isRotating = !isRotating;
                    if (isRotating) {
                        modelViewer.setAttribute('auto-rotate', '');
                        rotateBtn.textContent = '🔄 旋轉';
                        rotateBtn.classList.remove('active');
                    } else {
                        modelViewer.removeAttribute('auto-rotate');
                        rotateBtn.textContent = '⏹️ 停止';
                        rotateBtn.classList.add('active');
                    }
                } catch (error) {
                    console.error('切換旋轉失敗:', error);
                }
            };
        }

        function showError(message) {
            document.getElementById('studentName').textContent = '錯誤';
            speechBubblesContainer.innerHTML = `
                <div class="speech-bubble left">${message}</div>
            `;
        }

        window.addEventListener('DOMContentLoaded', loadStudentWork);
    </script>
</body>
</html>
